apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-lab-deployment
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      containers:
      - name: dotnet-container
        env:
        - name: DEPLOY_ENV
          value: prod
        # Probes come from the base — /healthz answers the same in every
        # environment. What differs here is the ceiling.
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            # No CPU limit on purpose: throttling in Kubernetes causes
            # unexpected latency spikes in .NET applications.
            memory: 512Mi
