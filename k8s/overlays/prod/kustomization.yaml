# Production setup on k3s (see ../../DEPLOY-PROD.md).
# The Service is left at its default ClusterIP — an Ingress fronts it.
#
#   kubectl apply -k k8s/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Registry image instead of the locally built one. CI publishes only on a
# v* tag, as both ghcr.io/deidron/k8s-lab:<tag> and :<commit-sha> — the same
# image under two names. Deploying means putting one of them here, which
# keeps the running version traceable to a commit.
images:
  - name: k8s-lab
    newName: ghcr.io/deidron/k8s-lab
    # Which build to run is a per-deployment decision, so this stays a
    # placeholder on purpose: it fails loudly instead of pulling something
    # unintended. Copy the release tag, or the SHA it was built from.
    newTag: REPLACE_WITH_RELEASE_TAG

patches:
  - path: deployment-patch.yaml
