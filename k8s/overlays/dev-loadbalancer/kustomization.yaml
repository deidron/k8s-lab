# LoadBalancer variant — for comparing Service type behaviour.
# On Docker Desktop it gives no direct access from Windows: the
# EXTERNAL-IP comes from the kind docker network, which is not
# routable from the host.
#
#   kubectl apply -k k8s/overlays/dev-loadbalancer
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Service
      name: k8s-lab-service
    patch: |
      - op: replace
        path: /spec/type
        value: LoadBalancer
