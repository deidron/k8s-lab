name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request makes the running checks pointless, and public
# repositories run on shared minutes. Runs on main are left alone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    # Every job runs code from the pull request, so the default six-hour
    # ceiling is the wrong shape: a hang, or a runner put to other use,
    # should die in minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-kubectl@v5

      # A broken patch or a renamed resource only shows up at apply time
      # otherwise — by then the cluster is already half-updated.
      - name: Render kustomize overlays
        run: |
          for overlay in dev-nodeport dev-loadbalancer prod; do
            echo "rendering k8s/overlays/$overlay"
            kubectl kustomize "k8s/overlays/$overlay" > /dev/null
          done
          echo "rendering monitoring/alloy"
          kubectl kustomize monitoring/alloy > /dev/null

      # Grafana silently ignores a dashboard whose JSON does not parse.
      - name: Validate dashboard JSON
        run: |
          for file in monitoring/grafana-dashboards/*.json; do
            echo "checking $file"
            jq empty "$file"
          done

      - name: Validate compose file
        run: docker compose -f monitoring/docker-compose.yml config --quiet

  # Nothing here publishes — see release.yml for that. Building anyway means a
  # broken Dockerfile fails a pull request instead of a release, and it keeps
  # the build cache warm: releases are rare enough that the cache would
  # otherwise have expired by the time one is cut.
  image:
    name: Build image
    needs: [test, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The default docker driver cannot export a build cache. Buildx sets
      # up a docker-container builder, which can — without it the cache-to
      # step below fails the job.
      - uses: docker/setup-buildx-action@v4

      # The tag is local and thrown away with the runner; a pull request ref
      # name ("3/merge") would not be a valid one anyway.
      - uses: docker/build-push-action@v7
        with:
          context: src/K8sLab
          file: src/K8sLab/Dockerfile
          push: false
          tags: k8slab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
