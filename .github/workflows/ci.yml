name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# The image job needs to write packages; everything else only reads.
permissions:
  contents: read

# A new push to a pull request makes the running checks pointless, and public
# repositories run on shared minutes. Never cancel a tag or a main build: those
# publish, and a half-finished publish is worse than a slow one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    # Every job runs code from the pull request, so the default six-hour
    # ceiling is the wrong shape: a hang, or a runner put to other use,
    # should die in minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-kubectl@v5

      # A broken patch or a renamed resource only shows up at apply time
      # otherwise — by then the cluster is already half-updated.
      - name: Render kustomize overlays
        run: |
          for overlay in dev-nodeport dev-loadbalancer prod; do
            echo "rendering k8s/overlays/$overlay"
            kubectl kustomize "k8s/overlays/$overlay" > /dev/null
          done
          echo "rendering monitoring/alloy"
          kubectl kustomize monitoring/alloy > /dev/null

      # Grafana silently ignores a dashboard whose JSON does not parse.
      - name: Validate dashboard JSON
        run: |
          for file in monitoring/grafana-dashboards/*.json; do
            echo "checking $file"
            jq empty "$file"
          done

      - name: Validate compose file
        run: docker compose -f monitoring/docker-compose.yml config --quiet

  image:
    name: Build and publish image
    needs: [test, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # Only a v* tag publishes. Every other run still builds the image, so a
      # broken Dockerfile fails the pull request instead of the release.
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      # The ancestry check below needs history; the default shallow fetch
      # brings a single commit and leaves nothing to compare against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag can be put on any commit, including one on a branch that never
      # went through review — pushing it would publish that code. Nothing in
      # the tag ruleset covers this: it protects a tag from being moved, not
      # from being placed. Fail loudly rather than quietly skipping the push,
      # because a green run with no image published looks like a release.
      - name: Refuse to publish a commit that is not on main
        if: env.PUBLISH == 'true'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      # The default docker driver cannot export a build cache. Buildx sets
      # up a docker-container builder, which can — without it the cache-to
      # step below fails the job.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by release tag and commit SHA, never a moving tag: a reused
      # tag makes a rollout silently keep the previous build, and `latest`
      # cannot be rolled back to. The tag ruleset keeps v* immutable.
      #
      # A pull request ref name ("3/merge") is not a valid image tag, so the
      # builds that do not publish get a throwaway local one instead.
      - name: Collect image tags
        id: tags
        run: |
          # A multi-line output needs the delimiter form; a bare newline in
          # the value is dropped.
          {
            echo 'list<<EOF'
            if [ "$PUBLISH" = "true" ]; then
              echo "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_REF_NAME"
              echo "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA"
            else
              echo 'k8slab:ci'
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: src/K8sLab
          file: src/K8sLab/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
