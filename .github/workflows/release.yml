# Publishing a release is what ships an image; see ci.yml for the checks that
# run on every pull request. A pushed tag on its own triggers nothing, so it
# costs nothing and decides nothing.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

# Two releases at once is not a real scenario, and cancelling a half-finished
# publish would be worse than letting it run.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  image:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # For the attestation at the end: one to record it, one for the OIDC
      # token that proves the claim came from this run.
      attestations: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      # On a release event the commit behind the default ref is not reliably
      # the tagged one, so the tag is checked out by name. Full history is for
      # the ancestry check below, which the shallow default leaves nothing to
      # compare against.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      # Named rather than taken from HEAD, so that editing the checkout above
      # cannot quietly point the rest of this at a different commit. The
      # ^{commit} peels the tag: on an annotated one a bare rev-parse returns
      # the SHA of the tag object, which is not a commit and names no build.
      - name: Resolve the tag to a commit
        id: commit
        run: echo "sha=$(git rev-parse "$RELEASE_TAG^{commit}")" >> "$GITHUB_OUTPUT"

      # A release can be cut from any branch, and its tag can sit on a commit
      # that never went through review — publishing it would ship that code.
      # Neither the release event nor the tag ruleset covers this: the ruleset
      # protects a tag from being moved, not from being placed.
      #
      # Reaching main also means the commit already passed the checks in
      # ci.yml, which is why they are not repeated here.
      - name: Refuse to publish a commit that is not on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${{ steps.commit.outputs.sha }}" origin/main; then
            echo "::error::$RELEASE_TAG points at a commit that is not on main"
            exit 1
          fi

      # The default docker driver has no access to the build cache at all, so
      # even reading the entries ci.yml wrote needs the docker-container
      # builder that buildx sets up.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Named by release tag and commit SHA, never a moving tag: a reused tag
      # makes a rollout silently keep the previous build, and `latest` cannot
      # be rolled back to. The tag ruleset keeps v* immutable.
      - name: Collect image tags
        id: tags
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          # A multi-line output needs the delimiter form; a bare newline in
          # the value is dropped.
          {
            echo 'list<<EOF'
            echo "ghcr.io/$GITHUB_REPOSITORY:$RELEASE_TAG"
            echo "ghcr.io/$GITHUB_REPOSITORY:$SHA"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # Only reads the cache. Pull requests and main fill it; a release must
      # not push cache entries of its own, or a rare release would be writing
      # what the frequent builds already maintain.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: src/K8sLab
          file: src/K8sLab/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # Standard OCI metadata, carried by the image itself rather than by
          # whatever wrote it down elsewhere. `source` is also what GHCR reads
          # to attach the package to this repository, which is what puts the
          # README on the package page and survives the package being
          # recreated.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
          cache-from: type=gha

      # Says, in a form that can be checked, that this digest came out of this
      # workflow from this commit — the question that matters when anyone with
      # write access to the registry could have put an image there by hand. It
      # attests where the image came from, not that the code is any good: a
      # compromised workflow would produce a valid attestation too.
      #
      # Named by digest rather than by tag, since the tag is a label that the
      # attestation would outlive. Verified at deploy time — see
      # k8s/DEPLOY-PROD.md.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Which image to deploy is otherwise knowable only by opening the run log.
  # Writing it into the release body puts it next to the notes, ready to be
  # copied into the prod overlay.
  #
  # A separate job because this is the only thing here that needs write access
  # to the repository, and it has no business hanging over the build.
  announce:
    name: Record the image in the release
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Append the published image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          # Re-running a failed release run lands here a second time, so the
          # block this wrote before is cut off first. The marker is an HTML
          # comment, which the release page does not render.
          MARKER='<!-- published-image -->'
          gh release view "$RELEASE_TAG" --repo "$REPO" --json body --jq .body \
            | sed "\|$MARKER|,\$d" > notes.md
          {
            echo "$MARKER"
            printf '\n---\n\nDeployed image:\n\n```\nghcr.io/%s:%s\n```\n' \
              "$REPO" "$RELEASE_TAG"
          } >> notes.md
          gh release edit "$RELEASE_TAG" --repo "$REPO" --notes-file notes.md
