# Monolithic Tempo with local storage — like Loki, for a single machine.
# The config schema in Tempo 3.x differs from 2.x: top-level ingester and
# compactor sections are no longer accepted, so only the essentials here.
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
